# Echter Kaltakquise-Entwurf für Malerbetrieb Müller, Düsseldorf.
# Quelle: eigene Website https://malerbetriebmueller.de.tl (Startseite, Über
# uns, Services, Kontakt, Impressum), Stand 17.08.2026. Farben (Rot-Akzent,
# fast-schwarze Flächen, heller Hintergrund) bewusst von der bestehenden
# Seite übernommen -- nur Schrift/Layout/Bau modernisiert, keine neue
# Markenfarbe erfunden. Texte selbst formuliert (nicht von der Originalseite
# kopiert), nur Fakten übernommen.
#
# ALLE FOTOS SIND PLATZHALTER: lizenzfreie, kommerziell nutzbare Stockfotos
# (Unsplash) -- zeigen NICHT den echten Betrieb oder echte Arbeiten von ihm.
# Nur eingesetzt, damit die Demo nicht leer wirkt. Vor echtem Einsatz beim
# Kunden durch dessen eigene Fotos ersetzen.

firmenname: "Malerbetrieb Müller"
branche: "Malerbetrieb"
ort: "Düsseldorf"
gruendungsjahr: "2014"

tagline: "Saubere Maler- und Renovierungsarbeiten in Düsseldorf -- persönlich betreut, termingenau umgesetzt."

# "kontrast" ist strukturell die beste Näherung an die echte Seite (heller
