      - src: "/demo/images/demos/beispiel-malerbetrieb/leistung-innen-1.webp"
        alt: "Frisch gestrichenes Wohnzimmer (Platzhalterfoto)"
      - src: "/demo/images/demos/beispiel-malerbetrieb/leistung-innen-2.webp"
        alt: "Wandanstrich in Arbeit (Platzhalterfoto)"
  - titel: "Fassaden"
    text: "Witterungsbeständige Fassadenanstriche inklusive Untergrundprüfung und Ausbesserung."
    bilder:
      - src: "/demo/images/demos/beispiel-malerbetrieb/leistung-fassade-1.webp"
        alt: "Gerüst an einer Fassade (Platzhalterfoto)"
      - src: "/demo/images/demos/beispiel-malerbetrieb/leistung-fassade-2.webp"
