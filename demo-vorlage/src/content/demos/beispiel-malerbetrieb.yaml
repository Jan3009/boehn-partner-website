  - titel: "Tapezierarbeiten"
    text: "Von der Beratung bis zum fertigen Raum, inklusive Untergrundvorbereitung."
  - titel: "Renovierungen"
    text: "Kompletträume aus einer Hand, abgestimmt mit Elektriker und Bodenleger falls nötig."

geschichte: "Seit 2009 in Walsrode und Umgebung im Einsatz. Familienbetrieb mit festem Team, keine wechselnden Subunternehmer -- wer den Auftrag bespricht, führt ihn auch aus."

