# Internes Test-/Anschauungsbeispiel (keine echte Firma) -- zeigt, wie das
# "schwarzgold"-Preset mit einer individuellen Akzentfarbe wirkt, inkl.
# Vorher/Nachher-Sektion. Zum Duplizieren für echte Kunden: _vorlage.example.yaml
# im Projekt-Root verwenden, nicht diese Datei.
#
# Fotos sind lizenzfreie Unsplash-Platzhalter, nur damit die Demo nicht leer
# wirkt -- keine echten Fotos eines echten Betriebs (gibt es nicht, ist fiktiv).

firmenname: "Malerbetrieb Beispiel"
branche: "Malerbetrieb"
ort: "Walsrode"
gruendungsjahr: "2009"

tagline: "Saubere Malerarbeiten innen und außen, termintreu und ohne böse Überraschungen bei der Abrechnung."

style: schwarzgold
akzentfarbe: "#D4AF37"

leistungen:
  - titel: "Innenanstriche"
    text: "Wände, Decken und Holzarbeiten fachgerecht vorbereitet und gestrichen, staubarm gearbeitet."
