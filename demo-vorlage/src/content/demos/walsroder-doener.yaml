# Überraschungs-Entwurf für Walsroder Döner, Walsrode -- KEIN bestätigter
# Kunde. Der Betrieb ist real (Von-Stoltzenberg-Straße 2, 29664 Walsrode),
# der Nutzer kennt die Inhaber persönlich und will ihnen diesen Entwurf
# unaufgefordert zeigen. Kein Kunden-Drive/Fragebogen moeglich (Phase 0 der
# SOP) -- Material stattdessen aus oeffentlichen Quellen: eigenes
# Instagram-Profil (@walsroderdoner), eigene Facebook-Seite, Google-/
# Facebook-Bewertungen, restaurantguru.com, swipein.restaurant,
# oeffnungszeitenbuch.de. Stand 29.08.2026.
#
# FOTOS: hero/bilder/galerie/kinoKapitel/speisekarteKategorien[].bild sind
# ECHTE, oeffentlich von @walsroderdoner (Instagram), der eigenen Facebook-
# Seite (Kueche/Theke, vom Nutzer direkt als Screenshots geschickt, Stand
# Fotos 2023-2024) gepostete Fotos (kein Stockmaterial) -- Team am
# Döner-Spieß, Küche mit beiden Spießen, Theke mit Menütafel, Terrasse,
# Grillgemüse-Platte, Logo-Nahaufnahme. Vor echtem Kundengespräch
# idealerweise durch aktuellere/hoeher aufgeloeste eigene Fotos ersetzen,
# die der Betrieb selbst liefert.
#
# SPEISEKARTE: speisekarteKategorien ist die ECHTE, aktuelle Preisliste --
# abfotografiert vom Nutzer aus dem echten Speisekartenordner des Ladens
# (Facebook-Fotoalbum, Stand der Fotos 23.02.2023 und 05.04.2024). Alle
# Gerichte/Preise 1:1 abgetippt, nichts geschaetzt oder erfunden. Falls sich
# seitdem etwas geaendert hat, vor echtem Einsatz mit dem Betrieb abgleichen.
#
# DESIGN-RICHTUNG (29.08.2026, Neustart auf expliziten Wunsch des Nutzers --
# "alles loeschen, von grund auf neu, weiss, hoch modern"): weg vom dunklen
# Gold/Kino-Look (Zenzakan-Referenz), hin zu einem hellen, klaren, dichten
# Editorial-Grid-Stil -- weisser Hintergrund, scharfe Kanten (kein Radius),
# fette Grotesk-Typo, eine kraeftige Akzentfarbe als flache Farbflaeche
# (Badges/Linien/Buttons) statt Glow-Effekten. Preset "kontrast" ist genau
# dafuer gebaut (Weiss/Schwarz, Space Grotesk, 0px-Radius, solide Buttons).
#
# NACHTRAG (02.09.2026): Der Umstieg auf Weiss wurde nie erfolgreich gebaut
# (fehlende Komponenten-Dateien im Repo, siehe Git-Historie), die Seite lief
# live also weiterhin auf der alten dunklen Palette -- und genau die soll
# laut Nutzer-Feedback auch bleiben ("das ist auch deren Branding, nichts
# weiss machen"). "style" ist deshalb wieder auf eine dunkle Palette gesetzt
# (jetzt "kontrast-dunkel" statt der inzwischen weissen "kontrast"), Rest des
# Textes oben ist nur noch als Verlauf/Kontext stehen gelassen.
#
# VIDEO Kapitel 1 (doener-header-real.mp4) ist ECHT -- vom Nutzer selbst
# per KI-Tool erzeugtes/bearbeitetes Produkt-Video (kein Stockmaterial mehr,
# 30.08.2026 hochgeladen), zeigt Essen/Produkt, keine echten Personen.
# VIDEO Kapitel 2 ist weiterhin PLATZHALTER: lizenzfreies Stockvideo von
# Pexels (pexels.com/video/expert-chef-slicing-doner-kebab-in-kitchen-
# 34730484, komprimiert/skaliert), zeigt NICHT den echten Anschnitt bei
# Walsroder Döner -- bewusst KEIN KI-generiertes Video von den echten
# Personen aus fb-1.jpg (das waere ein Deepfake einer echten, identifizierbaren
# Person und wird nicht gemacht). Vor echtem Kundengespräch durch eigenes
# Handyvideo vom Anschnitt ersetzen (reicht z. B. 10 Sek. hochkant).
#
# Bewertungen/Badges sind ECHTE, oeffentlich nachlesbare Zitate mit Autor --
# nichts erfunden, keine Bewertung ohne Quellenangabe uebernommen.

firmenname: "Walsroder Döner"
branche: "Döner & Grill"
ort: "Walsrode"

tagline: "Frisch vom Spieß, mit großzügigen Portionen: wir sind seit Jahren Walsrodes Nummer für Döner. Komm vorbei, lass dir liefern oder setz dich zu uns auf die Terrasse."

# kontrast-dunkel statt kontrast: Nutzer-Feedback (02.09.2026) -- die Seite
# soll dunkel bleiben, das ist bewusstes Branding, kein Umstieg auf Weiß.
# "kontrast" wurde inzwischen (fuer andere Kunden) auf eine weisse Palette
# umgestellt -- eigenes Preset "kontrast-dunkel" (presets.ts) haelt fuer
# Walsroder Döner exakt die bisherige dunkle Palette, ohne "kontrast" fuer
# andere Kunden (z. B. Malerbetrieb Müller) zu beeinflussen.
style: kontrast-dunkel
# Direkt aus den echten Kapitel-Fotos (Kohleglut im Grill) abgetastet
# (per Skript, hoechste Saettigung im Orange/Rot-Bereich) statt frei
# gewaehlt -- Nutzer-Feedback: Akzentfarbe wirkte nicht wie aus dem
# Header-Video, sondern zufaellig gewaehlt.
akzentfarbe: "#C6533D"

leistungen:
  - titel: "Döner & Dürüm"
    text: "Unser Klassiker frisch vom Spieß: knuspriges Brot, großzügig belegt, auch in vegetarischer Variante."
    bilder:
      - src: "/demo/images/demos/walsroder-doener/doener-schneiden-poster.webp"
        alt: "Frisch vom Spieß geschnittenes Döner-Fleisch"
  - titel: "Döner-Teller"
    text: "Bei uns gibt's Fleisch, Salat und Sauce satt auf dem Teller, für den großen Hunger."
    bilder:
      - src: "/demo/images/demos/walsroder-doener/insta-6.webp"
        alt: "Großes Tablett mit Fleisch, gefülltem Fladenbrot und frischem Salat (echtes Foto von Walsroder Döner)"
  - titel: "Cheeseburger"
    text: "Saftig gebraten und ordentlich belegt: unsere Gäste loben ihn ausdrücklich in ihren Bewertungen."
  - titel: "Grillplatten & Beilagen"
    text: "Wir grillen Gemüse, machen frische Salate und herzhafte Beilagen, alles liebevoll angerichtet."
    bilder:
      - src: "/demo/images/demos/walsroder-doener/insta-2.webp"
        alt: "Gegrilltes Gemüse mit Zitrone und frischen Kräutern (echtes Foto von Walsroder Döner)"
  - titel: "Lieferservice"
    text: "Wir liefern von 15 bis 21 Uhr, ab 20 € Bestellwert kostenlos zu dir. Ruf einfach an."
  - titel: "Terrasse & Parkplatz"
    text: "Setz dich zu uns raus, dazu ein kühles Getränk oder Bier. Parkplätze haben wir direkt vor der Tür."
    bilder:
      - src: "/demo/images/demos/walsroder-doener/insta-1.webp"
        alt: "Sonnige Außenterrasse mit Sitzplätzen von Walsroder Döner"

geschichte: "Wir sind seit Jahren ein fester Teil der Von-Stoltzenberg-Straße in Walsrode: ein eingespieltes Team, das dich beim Namen kennt, wenn du regelmäßig bei uns vorbeikommst. Bei Google haben wir 4,6 von 5 Sternen aus über 420 Bewertungen, auf Facebook empfehlen uns 98 % der über 1.200 Follower weiter. Unsere Gäste heben besonders die großzügigen Portionen, unser frisches Brot und Fleisch sowie das freundliche, schnelle Personal hervor: \"bester Dürüm im Heidekreis\", wie eine Bewertung es zusammenfasst. Ob schnell zwischendurch, gemütlich auf unserer Terrasse oder bequem zu dir geliefert: bei uns wird jeder satt."

