# Kapitel liefen als gepinnte GSAP-Scroll-Story -- beim Scrollen ploppten
# ploetzlich Team-/Kuechen-/Terrassen-Fotos im Kopfbereich auf, statt dass
# die Seite normal weiterscrollt. Gewuenscht ist stattdessen: EIN Header-
# Video, danach ganz normales Scrollen zum Rest der Seite. Mit nur einem
# Kapitel ueberspringt CinematicHero.astro (setupCineHero, `layers.length <
# 2`) die Pin/Crossfade-Logik automatisch -- die Section verhaelt sich dann
# wie ein normaler, nicht gepinnter Abschnitt. Die entfernten Fotos (Team,
# Kueche, Terrasse, Logo) gehen nicht verloren, sie stehen unveraendert in
# `galerie`/`bilder` oben.
kinoKapitel:
  - nummer: "01"
    titel: "Frisch vom Spieß"
    text: "Langsam gegart, direkt über der Glut: so schmeckt Döner, wie er schmecken soll."
    # Dateiname bewusst versioniert (statt Datei am alten Namen einfach zu
    # ueberschreiben) -- sonst behalten Browser die alte Version im Cache.
    # v2 -> v3: v2 war nicht "faststart" gemuxt (moov-Atom am Dateiende statt
    # am Anfang), dadurch musste das Handy quasi die komplette Datei laden
    # bevor Wiedergabe/Seek moeglich war -- auf Mobilfunk fuehrte das zu
    # kaputt wirkendem, "geisterndem" Bild (Nutzer-Video als Beleg). v3 ist
    # per "ffmpeg -movflags +faststart" neu gemuxt, gleiche Bildqualitaet.
    video: "/demo/images/demos/walsroder-doener/doener-header-real-v3.mp4"
    bild:
