# Echter Kaltakquise-Entwurf für Ti-Renovierung, Haldensleben -- ein Malerbetrieb
# (laut Telefonat 31.08.2026 korrigiert, urspruenglich als allgemeine
# "Renovierung" angelegt). Kunde hat KEINEN bestehenden Webauftritt (Websuche,
# Branchenbücher, Social Media, Telefonnummer-Rückwärtssuche: alle ohne
# Treffer, deckt sich mit CRM-Notiz "keine seite"). Leistungen sind noch nicht
# im Detail vom Kunden bestätigt -- branchenübliche Malerbetrieb-Leistungen
# als Platzhalter, vor Livegang mit Kunde abgleichen.
#
# KEINE Fotos hinterlegt (Nutzer-Vorgabe: erstmal nur echte, selbst erstellte
# Fotos verwenden, keine Stockbilder) -- alle "bilder"/"galerie"-Einträge ohne
# src, werden automatisch als beschriftete Platzhalter-Fläche gerendert.

firmenname: "Ti-Renovierung"
branche: "Malerbetrieb"
ort: "Haldensleben"

# Nutzer-Wunsch: Hero-Foto hat eigenen eingebrannten Text ("WIR RENOVIEREN."
# + Tagline) -- Seiten-eigene Kicker/Headline/Tagline im Hero ausgeblendet,
# damit sich das nicht mehr überlappt. Nur noch der "Jetzt anfragen"-Button
# bleibt zusätzlich zum Foto-Text sichtbar.
heroTextAusblenden: true

# Nutzer-Wunsch (Referenz: picassocolor.de): etwas verspielter/farbiger als
# Standard-editorial -- Akzent-Farbklecks-Grafiken hinter "Unsere Geschichte"
# und der Firmenname in Akzentfarbe in der Überschrift.
farbkleckse: true

tagline: "Saubere Malerarbeiten innen und außen -- termingerecht und ordentlich."

# Nutzer-Feedback: "kontrast" (fast schwarzer Hintergrund) wirkt eher wie eine
# Baufirma, nicht wie ein Maler -- auf "editorial" gewechselt (heller, warmer
# Hintergrund, ruhige Serifen-Headline), laut System-Empfehlung ohnehin die
# passende Wahl für Handwerk. Akzentfarbe vom Nutzer per Referenzfoto
# vorgegeben (Vorher/Nachher-Renovierungsfoto mit dunkelblauer Akzentwand im
# "Nachher"-Teil) -- aus dem Foto abgelesenes Blau übernommen statt frei
# geschätzt.
style: editorial
akzentfarbe: "#2E4C66"

# Bilder je Leistung: aus einer vom Nutzer bereitgestellten 4er-Bildercollage
# (KI-generiert, nicht vom echten Betrieb) zugeschnitten -- je 384x1024 aus
# der 1536x1024-Vorlage, ein Ausschnitt pro Leistung in Reihenfolge.
leistungen:
  - titel: "Innenanstriche"
    text: "Wände, Decken und Holzarbeiten fachgerecht vorbereitet und gestrichen."
    bilder:
      - src: "/demo/images/demos/ti-renovierung/leistung-innenanstriche.png"
        alt: "Malerarbeiten an einer Innenwand (Referenzfoto)"
  - titel: "Fassadenanstriche"
    text: "Witterungsbeständige Fassadenanstriche inklusive Untergrundprüfung."
    bilder:
      - src: "/demo/images/demos/ti-renovierung/leistung-fassadenanstriche.png"
        alt: "Fassadenanstrich auf dem Gerüst (Referenzfoto)"
  - titel: "Tapezierarbeiten"
    text: "Von der Beratung bis zum fertigen Raum, inklusive Untergrundvorbereitung."
    bilder:
      - src: "/demo/images/demos/ti-renovierung/leistung-tapezierarbeiten.png"
        alt: "Tapete wird angebracht (Referenzfoto)"
  - titel: "Renovierungen"
    text: "Kompletträume aus einer Hand, sauber und termingerecht umgesetzt."
    bilder:
      - src: "/demo/images/demos/ti-renovierung/leistung-renovierungen.png"
        alt: "Raum in Renovierung, vorbereitet für Malerarbeiten (Referenzfoto)"

geschichte: "Malerarbeiten aus einer Hand in Haldensleben und Umgebung -- von der ersten Absprache bis zum fertigen Raum, mit einem festen Ansprechpartner für das gesamte Projekt."

kontakt:
  telefon: "01525 7388897"
  adresse: "Bülstringer Str. 80A, 39340 Haldensleben"

bilder:
  # Vom Nutzer bereitgestelltes Referenzfoto (Vorher/Nachher-Renovierung,
  # generisch/nicht vom echten Betrieb). Volle Version MIT eingebranntem Text
  # ("WIR RENOVIEREN." + Tagline) auf ausdrücklichen Nutzerwunsch -- überlappt
  # sich mit der Seiten-eigenen Überschrift, Nutzer wollte den Text trotzdem
  # behalten.
  - src: "/demo/images/demos/ti-renovierung/hero.png"
    alt: "Vorher/Nachher-Ansicht einer Raumrenovierung mit Slogan (Referenzfoto)"
  - src: ""
    alt: "Inhaber von Ti-Renovierung (Foto folgt)"

galerie:
  - src: ""
    alt: "Abgeschlossene Malerarbeit (Foto folgt)"
  - src: ""
    alt: "Abgeschlossene Malerarbeit (Foto folgt)"
  - src: ""
    alt: "Abgeschlossene Malerarbeit (Foto folgt)"

quelle: "Telefonat mit dem Kunden am 31.08.2026, CRM-Lead 'Ti-Renovierung' (Close.com) -- Betrieb ist laut Kunde ein Malerbetrieb (Korrektur gegenüber erster Annahme). Kein bestehender Webauftritt auffindbar (Websuche, Branchenbücher, Social Media, Rückwärtssuche Telefonnummer -- alle ohne Treffer). Leistungen als branchenübliche Malerbetrieb-Platzhalter angenommen, noch nicht im Detail vom Kunden bestätigt -- vor Fertigstellung abgleichen."
